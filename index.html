<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12">
  <meta name="description" content="उमाभरत नित्य गर्भसंवाद">
  <title>उमाभरत नित्य गर्भसंवाद</title>

  <!-- Google Devanagari Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@300;400;600;700;800&family=Rozha+One&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --bg: #0c0a10;
      --paper: #15111c;
      --text: #f8f3eb;
      --text-muted: #9f9699;
      --accent-rose: #f0a8c8;
      --accent-violet: #ba8ce0;
      --accent-gold: #e2ba6f;
      --accent-green: #7ecba1;
      --accent-saffron: #f4a261;
      --accent-teal: #48cae4;
      --line: rgba(255, 255, 255, 0.07);
      --radius: 20px;

      --active-accent: var(--accent-rose);
      --active-glow: rgba(240, 168, 200, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans Devanagari", sans-serif;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, var(--active-glow), transparent 45%),
        radial-gradient(circle at 95% 90%, rgba(130, 80, 120, 0.12), transparent 40%),
        var(--bg);
      transition: background 400ms ease;
    }

    .app {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: max(6px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
      touch-action: pan-y;
    }

    .shell {
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: calc(100dvh - max(16px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
    }

    /* TOPBAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 2px;
    }

    .brand {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .dharmachakra-icon {
      font-size: 1.55rem;
      color: var(--active-accent);
      animation: spinClockwise 22s linear infinite;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 300ms ease;
      flex: 0 0 auto;
    }

    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-family: "Rozha One", serif;
      font-size: 1.18rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      line-height: 1.1;
      background: linear-gradient(90deg, #ffffff 0%, #f5eef9 60%, #8a7898 85%, #3d3546 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text h2 {
      margin: 1px 0 0 0;
      font-size: 0.72rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .header-day-counter {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--active-accent);
      background: rgba(255, 255, 255, 0.04);
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid var(--line);
      font-family: "Noto Sans Devanagari", sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      white-space: nowrap;
    }

    .header-share-btn {
      width: 29px;
      height: 29px;
      min-width: 29px;
      min-height: 29px;
      padding: 0;
      border: 1px solid rgba(126, 203, 161, 0.35);
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(126, 203, 161, 0.15), rgba(30, 80, 55, 0.35));
      color: #88edb5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(46, 139, 87, 0.15);
      transition: all 180ms ease;
    }

    .header-share-btn:active {
      transform: scale(0.91);
    }

    /* TABS */
    .tabs-wrapper {
      position: relative;
      width: 100%;
      margin: 1px 0 4px 0;
    }

    .tabs-container {
      display: flex;
      width: 100%;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1;
      min-width: max-content;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      padding: 4px 8px 6px 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms ease;
      font-family: "Noto Sans Devanagari", sans-serif;
      touch-action: manipulation;
    }

    .tab-btn.active {
      color: #ffffff;
      border-bottom: 3px solid var(--active-accent);
      background: linear-gradient(to top, var(--active-glow) 0%, transparent 100%);
    }

    /* PROGRESS */
    .progress-bar-wrap {
      width: 100%;
      padding: 0;
      margin-top: -2px;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--active-accent), #ffffff);
      transition: width 300ms ease, background 300ms ease;
    }

    /* BOOK READER */
    .book-reader {
      width: 100%;
      height: min(780px, 78dvh);
      min-height: 450px;
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      border-top: 2px solid var(--active-accent);
      border-bottom: 2px solid var(--active-accent);
      background: linear-gradient(180deg, rgba(23, 18, 30, 0.96) 0%, rgba(16, 12, 22, 0.98) 100%);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), 0 0 25px var(--active-glow);
      overflow: hidden;
      transition: border-color 300ms ease, box-shadow 300ms ease;
    }

    .book-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 16px;
      background: rgba(23, 18, 30, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 0 0 auto;
    }

    .chapter-title {
      margin: 0;
      font-family: "Noto Serif Devanagari", serif;
      font-size: clamp(0.94rem, 3.4vw, 1.15rem);
      font-weight: 700;
      color: #fffdfa;
      line-height: 1.35;
      text-align: left;
    }

    .book-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 18px 22px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      touch-action: pan-y;
    }

    .book-body::-webkit-scrollbar {
      width: 4px;
    }

    .book-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .prose-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .book-paragraph {
      margin: 0;
      font-family: "Noto Serif Devanagari", serif;
      font-size: clamp(0.92rem, 3.5vw, 1.02rem);
      font-weight: 300;
      line-height: 1.9;
      color: #ede5de;
      text-align: justify;
      text-justify: inter-word;
      letter-spacing: 0.012em;
      white-space: pre-line;
    }

    .book-paragraph:first-of-type::first-letter {
      font-family: "Noto Serif Devanagari", serif;
      font-size: 2rem;
      font-weight: 600;
      float: left;
      line-height: 1;
      margin-right: 8px;
      color: var(--active-accent);
    }

    /* MANTRA CARD (Matches closing-mantra-box: left/right border, center aligned) */
    .mantra-verse-card {
      margin: 14px 0 16px 0;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid var(--active-accent);
      border-right: 2px solid var(--active-accent);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mantra-verse-title {
      font-family: "Noto Serif Devanagari", serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--active-accent);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      display: block;
    }

    .mantra-verse-line {
      font-family: "Noto Serif Devanagari", serif;
      font-size: clamp(0.96rem, 3.7vw, 1.08rem);
      font-weight: 700;
      line-height: 1.9;
      color: var(--active-accent);
      letter-spacing: 0.02em;
      display: block;
    }

    .mantra-verse-empty {
      height: 8px;
      display: block;
    }

    /* SECTION HEADER (॥ चरणनिहाय सविस्तर अर्थ ॥ / ॥ गर्भसंवाद ॥) */
    .mantra-content-header {
      margin-top: 18px;
      margin-bottom: 8px;
      font-family: "Noto Serif Devanagari", serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--active-accent);
      display: block;
      letter-spacing: 0.02em;
    }

    .sanskar-line {
      margin: 4px 0;
      padding-left: 10px;
      border-left: 2px solid var(--active-accent);
      color: #f8f3eb;
    }

    .closing-mantra-box {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid var(--active-accent);
      border-right: 2px solid var(--active-accent);
      text-align: center;
    }

    .closing-text {
      font-family: "Tiro Devanagari Marathi", serif;
      font-size: 0.98rem;
      color: var(--active-accent);
      line-height: 1.6;
      margin: 0;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .closing-text i {
      font-size: 0.9rem;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .nav-btn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      border: 1px solid var(--active-accent);
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
      color: #ffffff;
      box-shadow: 0 4px 16px var(--active-glow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 180ms ease;
      font-family: "Noto Sans Devanagari", sans-serif;
      touch-action: manipulation;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-btn:active {
      transform: scale(0.91);
    }

    .nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      box-shadow: none;
    }

    .book-dedication-footer {
      text-align: center;
      font-size: 0.7rem;
      color: #928a90;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding-bottom: 2px;
    }

    @media (max-width: 480px) {
      .shell { gap: 8px; }
      .book-reader { height: min(760px, 78dvh); }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;

    function cleanNumberedLine(line) {
      if (!line || typeof line !== 'string') return '';
      return line
        .trim()
        .replace(/^(आई-बाबा|आई|बाबा)\s*[:ः\-]\s*/u, '')
        .trim();
    }

    function extractParagraphs(rawItem) {
      if (!rawItem) {
        return { day: "दिवस १", title: "नित्य गर्भसंवाद", paragraphs: [] };
      }

      if (!Array.isArray(rawItem) && typeof rawItem === 'object') {
        const paras = Array.isArray(rawItem.paragraphs)
          ? rawItem.paragraphs
          : (rawItem.messages || []);

        return {
          day: typeof rawItem.day === 'number' ? `दिवस ${rawItem.day}` : (rawItem.day || "दिवस १"),
          title: rawItem.title || "नित्य गर्भसंवाद",
          paragraphs: paras.map(p => cleanNumberedLine(p)).filter(Boolean)
        };
      }

      const day = rawItem[0] || "दिवस १";
      const title = rawItem[1] || "नित्य गर्भसंवाद";
      const rawBody = rawItem[2] || "";

      let lines = [];
      if (Array.isArray(rawBody)) {
        lines = rawBody;
      } else if (typeof rawBody === 'string') {
        lines = rawBody.split('\n');
      }

      const paragraphs = lines.map(l => cleanNumberedLine(l)).filter(l => l.length > 0);

      return { day, title, paragraphs };
    }

    const FALLBACK_DATA = [
      {
        day: "दिवस १",
        title: "माहिती उपलब्ध नाही",
        paragraphs: ["कृपया इंटरनेट कनेक्शन किंवा डेटा फाइल्सचा पाथ तपासा."]
      }
    ];

    function App() {
      const [speaker, setSpeaker] = useState('mother');

      const [dataMap, setDataMap] = useState({
        mother: FALLBACK_DATA,
        father: FALLBACK_DATA,
        parent: FALLBACK_DATA,
        story: FALLBACK_DATA,
        mantra: FALLBACK_DATA,
        sanskar: FALLBACK_DATA
      });

      const [currentIndex, setCurrentIndex] = useState(0);

      const scrollRef = useRef(null);
      const tabsContainerRef = useRef(null);

      const touchStartX = useRef(null);
      const touchStartY = useRef(null);
      const touchStartTime = useRef(0);

      /* DYNAMIC THEME */
      useEffect(() => {
        const root = document.documentElement;

        const themes = {
          mother: { accent: 'var(--accent-rose)', glow: 'rgba(240, 168, 200, 0.18)' },
          father: { accent: 'var(--accent-violet)', glow: 'rgba(186, 140, 224, 0.18)' },
          parent: { accent: 'var(--accent-gold)', glow: 'rgba(226, 186, 111, 0.18)' },
          story: { accent: 'var(--accent-green)', glow: 'rgba(126, 203, 161, 0.18)' },
          mantra: { accent: 'var(--accent-saffron)', glow: 'rgba(244, 162, 97, 0.18)' },
          sanskar: { accent: 'var(--accent-teal)', glow: 'rgba(72, 202, 228, 0.18)' }
        };

        const activeTheme = themes[speaker] || themes.mother;
        root.style.setProperty('--active-accent', activeTheme.accent);
        root.style.setProperty('--active-glow', activeTheme.glow);
      }, [speaker]);

      /* LOAD DATA FILES */
      useEffect(() => {
        const loadFiles = async () => {
          const files = [
            { key: 'mother', path: './data/mothers.json' },
            { key: 'father', path: './data/fathers.json' },
            { key: 'parent', path: './data/parent.json' },
            { key: 'story', path: './data/story.json' },
            { key: 'mantra', path: './data/mantra.json' },
            { key: 'sanskar', path: './data/sanskar.json' }
          ];

          const newDataMap = { ...dataMap };

          for (let file of files) {
            try {
              const res = await fetch(file.path);
              if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                  newDataMap[file.key] = data;
                }
              }
            } catch (e) {
              console.log(`Could not load ${file.path}`, e);
            }
          }

          setDataMap(newDataMap);
        };

        loadFiles();
      }, []);

      const activeList = dataMap[speaker] || FALLBACK_DATA;
      const totalDays = activeList.length;
      const safeIndex = Math.min(currentIndex, Math.max(0, totalDays - 1));
      const { day, title, paragraphs } = extractParagraphs(activeList[safeIndex]);

      const progressPercent = totalDays > 0 ? ((safeIndex + 1) / totalDays) * 100 : 0;

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = 0;
        }
      }, [safeIndex, speaker]);

      const handleSpeakerChange = (newSpeaker, event) => {
        setSpeaker(newSpeaker);
        setCurrentIndex(0);

        if (event && event.target && tabsContainerRef.current) {
          event.target.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest',
            inline: 'center'
          });
        }
      };

      const goToPrev = () => {
        if (safeIndex > 0) setCurrentIndex(safeIndex - 1);
      };

      const goToNext = () => {
        if (safeIndex < totalDays - 1) setCurrentIndex(safeIndex + 1);
      };

      const handleShare = async () => {
        const shareText = `${title}\n${day}\n\nउमाभरत – नित्य गर्भसंवाद`;
        try {
          if (navigator.share) {
            await navigator.share({ title: 'उमाभरत – नित्य गर्भसंवाद', text: shareText });
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(shareText);
            alert('सामग्री कॉपी झाली.');
          } else {
            alert(shareText);
          }
        } catch (e) {
          if (e && e.name !== 'AbortError') console.log('Share error', e);
        }
      };

      /* SWIPE GESTURES */
      useEffect(() => {
        const onTouchStart = (e) => {
          if (!e.touches || e.touches.length !== 1) return;
          touchStartX.current = e.touches[0].clientX;
          touchStartY.current = e.touches[0].clientY;
          touchStartTime.current = Date.now();
        };

        const onTouchEnd = (e) => {
          if (touchStartX.current === null || !e.changedTouches || e.changedTouches.length !== 1) return;
          const endX = e.changedTouches[0].clientX;
          const endY = e.changedTouches[0].clientY;
          const dx = endX - touchStartX.current;
          const dy = endY - touchStartY.current;
          const elapsed = Date.now() - touchStartTime.current;

          touchStartX.current = null;
          touchStartY.current = null;

          if (elapsed > 900 || Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.35) return;
          if (dx < 0) goToNext(); else goToPrev();
        };

        document.addEventListener('touchstart', onTouchStart, { passive: true });
        document.addEventListener('touchend', onTouchEnd, { passive: true });

        return () => {
          document.removeEventListener('touchstart', onTouchStart);
          document.removeEventListener('touchend', onTouchEnd);
        };
      }, [safeIndex, totalDays]);

      const TABS = [
        { id: 'mother', label: 'आई' },
        { id: 'father', label: 'बाबा' },
        { id: 'parent', label: 'पालक' },
        { id: 'story', label: 'कथा' },
        { id: 'mantra', label: 'मंत्र' },
        { id: 'sanskar', label: 'संस्कार' }
      ];

      /* MANTRA RENDERER WITH DEDICATED VERSE CARD */
      const renderContent = () => {
        if (speaker !== 'mantra') {
          return paragraphs.map((p, idx) => {
            const trimmed = p.trim();
            if (speaker === 'sanskar' && (trimmed.includes('विचार:') || trimmed.includes('कृती:'))) {
              return React.createElement('p', { key: idx, className: 'book-paragraph sanskar-line' }, trimmed);
            }
            return React.createElement('p', { key: idx, className: 'book-paragraph' }, p);
          });
        }

        // MANTRA TAB SPECIFIC PROCESSING
        const elements = [];
        let i = 0;
        while (i < paragraphs.length) {
          const trimmed = paragraphs[i].trim();

          // Check if this is the start of a Mantra Verse Card:
          // Either a header like ॥ प्रातःस्मरण महामंत्र ॥ immediately followed by verses,
          // OR direct shloka block containing । or ॥ or starting with ॐ
          const isHeader = trimmed.startsWith('॥') && trimmed.endsWith('॥') && !trimmed.includes('\n');
          const isVerseHeader = isHeader && !trimmed.includes('अर्थ') && !trimmed.includes('गर्भसंवाद') && !trimmed.includes('हितगुज');

          if (isVerseHeader && i + 1 < paragraphs.length && (paragraphs[i + 1].includes('।') || paragraphs[i + 1].includes('॥') || paragraphs[i + 1].trim().startsWith('ॐ'))) {
            const cardHeader = trimmed;
            const cardVerseLines = paragraphs[i + 1].split('\n');
            elements.push(
              React.createElement('div', { key: `mantra-card-${i}`, className: 'mantra-verse-card' },
                React.createElement('span', { className: 'mantra-verse-title' }, cardHeader),
                cardVerseLines.map((line, lIdx) => {
                  const lTrim = line.trim();
                  if (!lTrim) return React.createElement('span', { key: lIdx, className: 'mantra-verse-empty' });
                  return React.createElement('span', { key: lIdx, className: 'mantra-verse-line' }, lTrim);
                })
              )
            );
            i += 2;
            continue;
          } else if (!isHeader && (trimmed.includes('।') || trimmed.includes('॥') || trimmed.startsWith('ॐ'))) {
            // Standalone shloka verse block
            const cardVerseLines = paragraphs[i].split('\n');
            elements.push(
              React.createElement('div', { key: `mantra-card-${i}`, className: 'mantra-verse-card' },
                cardVerseLines.map((line, lIdx) => {
                  const lTrim = line.trim();
                  if (!lTrim) return React.createElement('span', { key: lIdx, className: 'mantra-verse-empty' });
                  return React.createElement('span', { key: lIdx, className: 'mantra-verse-line' }, lTrim);
                })
              )
            );
            i++;
            continue;
          }

          // Content Headers: ॥ चरणनिहाय सविस्तर अर्थ ॥ or ॥ गर्भसंवाद ॥
          if (isHeader) {
            elements.push(
              React.createElement('h3', { key: `header-${i}`, className: 'mantra-content-header' }, trimmed)
            );
            i++;
            continue;
          }

          // Standard paragraph (intro, numbered meanings, or garbhasamvad)
          elements.push(
            React.createElement('p', { key: `para-${i}`, className: 'book-paragraph' }, paragraphs[i])
          );
          i++;
        }

        return elements;
      };

      return React.createElement(
        'div',
        { className: 'app' },
        React.createElement(
          'div',
          { className: 'shell' },

          /* TOPBAR */
          React.createElement(
            'header',
            { className: 'topbar' },
            React.createElement(
              'div',
              { className: 'brand' },
              React.createElement('i', { className: 'fa-solid fa-dharmachakra dharmachakra-icon' }),
              React.createElement(
                'div',
                { className: 'brand-text' },
                React.createElement('h1', null, 'उमाभरत'),
                React.createElement('h2', null, 'नित्य गर्भसंवाद')
              )
            ),
            React.createElement(
              'div',
              { className: 'header-actions' },
              React.createElement('div', { className: 'header-day-counter' }, `${day} / ${totalDays}`),
              React.createElement(
                'button',
                {
                  className: 'header-share-btn',
                  onClick: handleShare,
                  'aria-label': 'शेअर करा',
                  title: 'शेअर करा'
                },
                React.createElement('i', { className: 'fa-solid fa-share-nodes' })
              )
            )
          ),

          /* HORIZONTAL TABS */
          React.createElement(
            'div',
            { className: 'tabs-wrapper' },
            React.createElement(
              'div',
              { className: 'tabs-container', ref: tabsContainerRef },
              TABS.map(tab =>
                React.createElement(
                  'button',
                  {
                    key: tab.id,
                    className: `tab-btn ${speaker === tab.id ? 'active' : ''}`,
                    onClick: e => handleSpeakerChange(tab.id, e)
                  },
                  tab.label
                )
              )
            )
          ),

          /* PROGRESS BAR */
          React.createElement(
            'div',
            { className: 'progress-bar-wrap' },
            React.createElement(
              'div',
              { className: 'progress-track' },
              React.createElement('div', {
                className: 'progress-fill',
                style: { width: `${progressPercent}%` }
              })
            )
          ),

          /* MAIN BOOK READER */
          React.createElement(
            'main',
            { className: 'book-reader' },
            React.createElement(
              'div',
              { className: 'book-header' },
              React.createElement('h2', { className: 'chapter-title' }, title)
            ),
            React.createElement(
              'div',
              { className: 'book-body', ref: scrollRef },
              React.createElement(
                'div',
                { className: 'prose-content' },
                renderContent()
              ),

              React.createElement(
                'div',
                { className: 'closing-mantra-box' },
                React.createElement(
                  'p',
                  { className: 'closing-text' },
                  React.createElement('i', { className: 'fa-solid fa-praying-hands' }),
                  ' आई-बाबांचे प्रेम आणि शुभ आशीर्वाद ',
                  React.createElement('i', { className: 'fa-solid fa-praying-hands' })
                )
              )
            )
          ),

          /* BOTTOM NAV */
          React.createElement(
            'nav',
            { className: 'bottom-nav' },
            React.createElement(
              'div',
              { style: { display: 'flex', justifyContent: 'flex-start' } },
              React.createElement(
                'button',
                {
                  className: 'nav-btn',
                  onClick: goToPrev,
                  disabled: safeIndex === 0,
                  'aria-label': 'मागील दिवस',
                  title: 'मागील दिवस'
                },
                React.createElement('i', { className: 'fa-solid fa-chevron-left' })
              )
            ),
            React.createElement('div', null),
            React.createElement(
              'div',
              { style: { display: 'flex', justifyContent: 'flex-end' } },
              React.createElement(
                'button',
                {
                  className: 'nav-btn',
                  onClick: goToNext,
                  disabled: safeIndex === totalDays - 1,
                  'aria-label': 'पुढील दिवस',
                  title: 'पुढील दिवस'
                },
                React.createElement('i', { className: 'fa-solid fa-chevron-right' })
              )
            )
          ),

          /* FOOTER */
          React.createElement(
            'div',
            { className: 'book-dedication-footer' },
            'प्रिय बाळासाठी, उर्मिला भरत रासवे तर्फे...'
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
