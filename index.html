<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12">
  <meta name="description" content="उमाभरत नित्य गर्भसंवाद">
  <title>उमाभरत नित्य गर्भसंवाद</title>

  <!-- Google Devanagari Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@300;400;600;700;800&family=Rozha+One&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --bg: #0c0a10;
      --paper: #15111c;
      --text: #f8f3eb;
      --text-muted: #9f9699;
      --accent-rose: #f0a8c8;
      --accent-violet: #ba8ce0;
      --accent-gold: #e2ba6f;
      --accent-green: #7ecba1;
      --accent-saffron: #f4a261;
      --accent-teal: #48cae4;
      --line: rgba(255, 255, 255, 0.07);
      --radius: 20px;

      /* Active theme dynamic variable */
      --active-accent: var(--accent-rose);
      --active-glow: rgba(240, 168, 200, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans Devanagari", sans-serif;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, var(--active-glow), transparent 45%),
        radial-gradient(circle at 95% 90%, rgba(130, 80, 120, 0.12), transparent 40%),
        var(--bg);
      transition: background 400ms ease;
    }

    .app {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: max(8px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    }

    .shell {
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      min-height: calc(100dvh - max(20px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
    }

    /* COMPACT HEADER */
    .main-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
    }

    /* Top Row: Logo Left, Day Count Right */
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dharmachakra-icon {
      font-size: 1.6rem;
      color: var(--active-accent);
      animation: spinClockwise 22s linear infinite;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 300ms ease;
    }

    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    .brand-text h1 {
      margin: 0;
      font-family: "Rozha One", serif;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      line-height: 1.1;
      background: linear-gradient(90deg, #ffffff 0%, #f5eef9 60%, #8a7898 85%, #3d3546 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text h2 {
      margin: 2px 0 0 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .header-day-count {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--active-accent);
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid var(--line);
      font-family: "Noto Sans Devanagari", sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* WEB-STYLE TABS (Seating on horizontal line) */
    .web-tabs-container {
      display: flex;
      width: 100%;
      border-bottom: 1px solid var(--line); /* Horizontal Line Separator */
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .web-tabs-container::-webkit-scrollbar {
      display: none;
    }

    .web-tab {
      flex: 1;
      min-width: max-content;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent; /* Space for active underline */
      color: var(--text-muted);
      padding: 6px 12px 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms ease;
      font-family: "Noto Sans Devanagari", sans-serif;
    }

    .web-tab.active {
      color: #ffffff;
      border-bottom: 3px solid var(--active-accent); /* Colored Underline */
      background: linear-gradient(to top, var(--active-glow) 0%, transparent 100%);
    }

    /* PROGRESS TRACK (Counter removed, span 100%) */
    .progress-bar-wrap {
      width: 100%;
      padding: 0;
      margin-top: 2px;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--active-accent), #ffffff);
      transition: width 300ms ease, background 300ms ease;
    }

    /* BOOK-LIKE NATURAL READER CONTAINER */
    .book-reader {
      width: 100%;
      height: min(690px, 69dvh);
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      border-top: 2px solid var(--active-accent);
      border-bottom: 2px solid var(--active-accent);
      background: linear-gradient(180deg, rgba(23, 18, 30, 0.96) 0%, rgba(16, 12, 22, 0.98) 100%);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), 0 0 25px var(--active-glow);
      overflow: hidden;
      transition: border-color 300ms ease, box-shadow 300ms ease;
    }

    /* Sticky Chapter Header */
    .book-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 18px;
      background: rgba(23, 18, 30, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chapter-title {
      margin: 0;
      font-family: "Noto Serif Devanagari", serif;
      font-size: clamp(0.96rem, 3.5vw, 1.16rem);
      font-weight: 700;
      color: #fffdfa;
      line-height: 1.35;
      text-align: left;
    }

    /* Scrollable Book Body */
    .book-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 20px 24px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .book-body::-webkit-scrollbar {
      width: 4px;
    }
    .book-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Long-Form Book Paragraphs */
    .prose-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .book-paragraph {
      margin: 0;
      font-family: "Noto Serif Devanagari", serif;
      font-size: clamp(0.92rem, 3.6vw, 1.02rem);
      font-weight: 300;
      line-height: 1.95;
      color: #ede5de;
      text-align: justify;
      text-justify: inter-word;
      letter-spacing: 0.012em;
    }

    .book-paragraph:first-of-type::first-letter {
      font-family: "Noto Serif Devanagari", serif;
      font-size: 2rem;
      font-weight: 600;
      float: left;
      line-height: 1;
      margin-right: 8px;
      color: var(--active-accent);
    }

    /* For Sanskar block rendering */
    .sanskar-line {
      margin: 4px 0;
      padding-left: 12px;
      border-left: 2px solid var(--active-accent);
      color: #f8f3eb;
    }

    /* Sacred Closing Quote / Mantra */
    .closing-mantra-box {
      margin-top: 24px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid var(--active-accent);
      border-right: 2px solid var(--active-accent);
      text-align: center;
    }

    .closing-text {
      font-family: "Tiro Devanagari Marathi", serif;
      font-size: 1.02rem;
      color: var(--active-accent);
      line-height: 1.7;
      margin: 0;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .closing-text i {
      font-size: 0.95rem;
    }

    /* BOTTOM NAV BAR */
    .bottom-nav {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr 1.1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .nav-btn {
      min-height: 46px;
      border: 1px solid var(--active-accent);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
      color: #ffffff;
      box-shadow: 0 4px 16px var(--active-glow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 180ms ease;
      font-family: "Noto Sans Devanagari", sans-serif;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      box-shadow: none;
    }

    /* SHARE BUTTON */
    .share-btn {
      min-height: 46px;
      border: 1px solid rgba(126, 203, 161, 0.35);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(126, 203, 161, 0.15), rgba(30, 80, 55, 0.35));
      color: #88edb5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(46, 139, 87, 0.15);
      transition: all 180ms ease;
    }

    /* DEDICATION FOOTER */
    .book-dedication-footer {
      text-align: center;
      font-size: 0.72rem;
      color: #928a90;
      font-weight: 500;
      margin-top: -2px;
      letter-spacing: 0.03em;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c1726;
      color: #fff;
      border: 1px solid var(--active-accent);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 100;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.65);
      animation: fadeInOut 2.5s ease forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;

    function extractParagraphs(rawItem) {
      if (!rawItem) return { day: "दिवस १", title: "नित्य गर्भसंवाद", paragraphs: [] };

      if (!Array.isArray(rawItem) && typeof rawItem === 'object') {
        const paras = Array.isArray(rawItem.paragraphs) ? rawItem.paragraphs : (rawItem.messages || []);
        return {
          day: typeof rawItem.day === 'number' ? `दिवस ${rawItem.day}` : (rawItem.day || "दिवस १"),
          title: rawItem.title || "नित्य गर्भसंवाद",
          paragraphs: paras.map(p => cleanNumberedLine(p)).filter(Boolean)
        };
      }

      const day = rawItem[0] || "दिवस १";
      const title = rawItem[1] || "नित्य गर्भसंवाद";
      const rawBody = rawItem[2] || "";

      let lines = [];
      if (Array.isArray(rawBody)) {
        lines = rawBody;
      } else if (typeof rawBody === 'string') {
        lines = rawBody.split('\n');
      }

      const paragraphs = lines
        .map(l => cleanNumberedLine(l))
        .filter(l => l.length > 0);

      return { day, title, paragraphs };
    }

    function cleanNumberedLine(line) {
      if (!line || typeof line !== 'string') return '';
      return line.trim()
        .replace(/^[०१२३४५६७८९\d]+[\.\-\)\s]+/u, '')
        .replace(/^(आई-बाबा|आई|बाबा)\s*[:ः\-]\s*/u, '')
        .trim();
    }

    // Default Fallbacks
    const FALLBACK_DATA = [{ day: "दिवस १", title: "माहिती उपलब्ध नाही", paragraphs: ["कृपया इंटरनेट कनेक्शन तपासा."] }];

    function App() {
      const [speaker, setSpeaker] = useState('mother'); 
      
      const [dataMap, setDataMap] = useState({
        mother: FALLBACK_DATA,
        father: FALLBACK_DATA,
        parent: FALLBACK_DATA,
        story: FALLBACK_DATA,
        mantra: FALLBACK_DATA,
        sanskar: FALLBACK_DATA
      });

      const [currentIndex, setCurrentIndex] = useState(0);
      const scrollRef = useRef(null);
      const tabsContainerRef = useRef(null);

      // Theme Sync
      useEffect(() => {
        const root = document.documentElement;
        const themes = {
          mother: { accent: 'var(--accent-rose)', glow: 'rgba(240, 168, 200, 0.18)' },
          father: { accent: 'var(--accent-violet)', glow: 'rgba(186, 140, 224, 0.18)' },
          parent: { accent: 'var(--accent-gold)', glow: 'rgba(226, 186, 111, 0.18)' },
          story: { accent: 'var(--accent-green)', glow: 'rgba(126, 203, 161, 0.18)' },
          mantra: { accent: 'var(--accent-saffron)', glow: 'rgba(244, 162, 97, 0.18)' },
          sanskar: { accent: 'var(--accent-teal)', glow: 'rgba(72, 202, 228, 0.18)' }
        };
        const activeTheme = themes[speaker] || themes.mother;
        root.style.setProperty('--active-accent', activeTheme.accent);
        root.style.setProperty('--active-glow', activeTheme.glow);
      }, [speaker]);

      // Load all 6 JSON files
      useEffect(() => {
        const loadFiles = async () => {
          const files = [
            { key: 'mother', path: './data/mothers.json' },
            { key: 'father', path: './data/fathers.json' },
            { key: 'parent', path: './data/parent.json' },
            { key: 'story', path: './data/story.json' },
            { key: 'mantra', path: './data/mantra.json' },
            { key: 'sanskar', path: './data/sanskar.json' }
          ];

          const newDataMap = { ...dataMap };
          for (let file of files) {
            try {
              const res = await fetch(file.path);
              if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                  newDataMap[file.key] = data;
                }
              }
            } catch (e) { console.log(`Could not load ${file.path}`); }
          }
          setDataMap(newDataMap);
        };
        loadFiles();
      }, []);

      const activeList = dataMap[speaker] || FALLBACK_DATA;
      const totalDays = activeList.length;
      const safeIndex = Math.min(currentIndex, Math.max(0, totalDays - 1));
      const { day, title, paragraphs } = extractParagraphs(activeList[safeIndex]);
      const progressPercent = totalDays > 0 ? ((safeIndex + 1) / totalDays) * 100 : 0;

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = 0;
      }, [safeIndex, speaker]);

      const handleSpeakerChange = (newSpeaker, event) => {
        setSpeaker(newSpeaker);
        setCurrentIndex(0);
        // Scroll tab into view if needed
        if (event && event.target && tabsContainerRef.current) {
          event.target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      };

      const goToPrev = () => { if (safeIndex > 0) setCurrentIndex(safeIndex - 1); };
      const goToNext = () => { if (safeIndex < totalDays - 1) setCurrentIndex(safeIndex + 1); };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft') goToPrev();
          if (e.key === 'ArrowRight') goToNext();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [safeIndex, totalDays]);

      const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; };
      const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
      const handleTouchEnd = () => {
        const diff = touchStartX.current - touchEndX.current;
        if (diff > 55) goToNext();
        else if (diff < -55) goToPrev();
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2600);
      };

      const handleShare = async () => {
        if (isSharing) return;
        setIsSharing(true);
        showToast('पुस्तक पान तयार होत आहे...');

        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const width = 1080;
          const padding = 80;
          const contentWidth = width - padding * 2;

          ctx.font = '300 32px "Noto Serif Devanagari", serif';
          let calculatedHeight = 440;

          const wrappedParagraphs = [];
          paragraphs.forEach((pText) => {
            const words = pText.split(' ');
            let currentLine = '';
            const pLines = [];
            words.forEach((word) => {
              const testLine = currentLine ? `${currentLine} ${word}` : word;
              if (ctx.measureText(testLine).width > contentWidth) {
                pLines.push(currentLine);
                currentLine = word;
              } else {
                currentLine = testLine;
              }
            });
            if (currentLine) pLines.push(currentLine);
            wrappedParagraphs.push(pLines);
          });

          const totalLines = wrappedParagraphs.reduce((acc, p) => acc + p.length, 0);
          calculatedHeight += totalLines * 52 + wrappedParagraphs.length * 28 + 180;
          canvas.width = width;
          canvas.height = Math.max(1450, calculatedHeight);

          const bgGrad = ctx.createLinearGradient(0, 0, width, canvas.height);
          bgGrad.addColorStop(0, '#16121d');
          bgGrad.addColorStop(0.5, '#1e1829');
          bgGrad.addColorStop(1, '#110d18');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, canvas.height);

          ctx.strokeStyle = 'rgba(240, 168, 200, 0.25)';
          ctx.lineWidth = 2;
          ctx.strokeRect(30, 30, width - 60, canvas.height - 60);
          ctx.strokeStyle = 'rgba(226, 186, 111, 0.18)';
          ctx.lineWidth = 1;
          ctx.strokeRect(40, 40, width - 80, canvas.height - 80);

          ctx.fillStyle = '#f0a8c8';
          ctx.font = '400 42px "Rozha One", serif';
          ctx.fillText('उमाभरत नित्य गर्भसंवाद', padding, 120);

          let sectionName = 'आईचे संवाद';
          if (speaker === 'father') sectionName = 'बाबांचे संवाद';
          if (speaker === 'parent') sectionName = 'पालक (एकत्रित) संवाद';
          if (speaker === 'story') sectionName = 'गोष्टीरूपी गर्भसंवाद (कथा)';
          if (speaker === 'mantra') sectionName = 'गर्भसंस्कार मंत्र';
          if (speaker === 'sanskar') sectionName = 'गर्भसंस्कार विचार';

          ctx.fillStyle = '#e2ba6f';
          ctx.font = '600 26px "Noto Sans Devanagari", sans-serif';
          ctx.fillText(`${day}  •  ${sectionName}`, padding, 180);

          ctx.fillStyle = '#ffffff';
          ctx.font = '700 44px "Noto Serif Devanagari", serif';
          ctx.fillText(title, padding, 255);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.fillRect(padding, 290, contentWidth, 2);

          let y = 355;
          ctx.fillStyle = '#eae2dc';
          ctx.font = '300 32px "Noto Serif Devanagari", serif';

          wrappedParagraphs.forEach((pLines) => {
            pLines.forEach((wLine) => {
              ctx.fillText(wLine, padding, y);
              y += 50;
            });
            y += 24;
          });

          ctx.textAlign = 'center';
          ctx.fillStyle = '#e2ba6f';
          ctx.font = '400 30px "Tiro Devanagari Marathi", serif';
          ctx.fillText('🙏 आई-बाबांचे प्रेम आणि शुभ आशीर्वाद 🙏', width / 2, canvas.height - 85);

          canvas.toBlob(async (blob) => {
            if (!blob) {
              setIsSharing(false);
              return;
            }
            const fileName = `Garbhasamwad_${day.replace(/\s+/g, '')}.png`;
            const file = new File([blob], fileName, { type: 'image/png' });
            const shareText = `*उमाभरत नित्य गर्भसंवाद*\n${day}: *${title}* (${sectionName})\n\n${paragraphs.join('\n\n')}\n\n🙏 आई-बाबांचे प्रेम आणि शुभ आशीर्वाद 🙏`;

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({ files: [file], title: 'उमाभरत नित्य गर्भसंवाद', text: shareText });
                showToast('यशस्वीरित्या शेअर केले!');
              } catch (err) {
                if (err.name !== 'AbortError') fallbackWhatsApp(shareText);
              }
            } else {
              const downloadLink = document.createElement('a');
              downloadLink.href = URL.createObjectURL(blob);
              downloadLink.download = fileName;
              downloadLink.click();
              fallbackWhatsApp(shareText);
            }
            setIsSharing(false);
          }, 'image/png');
        } catch (e) {
          setIsSharing(false);
          showToast('शेअर करताना त्रुटी आली.');
        }
      };

      const fallbackWhatsApp = (text) => {
        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };

      const TABS = [
        { id: 'mother', label: 'आई' },
        { id: 'father', label: 'बाबा' },
        { id: 'parent', label: 'पालक' },
        { id: 'story', label: 'कथा' },
        { id: 'mantra', label: 'मंत्र' },
        { id: 'sanskar', label: 'संस्कार' }
      ];

      return React.createElement('div', { className: 'app' },
        React.createElement('div', { className: 'shell' },

          /* COMPACT MAIN HEADER */
          React.createElement('header', { className: 'main-header' },
            
            /* TOP ROW: Logo Left, Day Right */
            React.createElement('div', { className: 'top-row' },
              React.createElement('div', { className: 'brand' },
                React.createElement('i', { className: 'fa-solid fa-dharmachakra dharmachakra-icon' }),
                React.createElement('div', { className: 'brand-text' },
                  React.createElement('h1', null, 'उमाभरत'),
                  React.createElement('h2', null, 'नित्य गर्भसंवाद')
                )
              ),
              React.createElement('div', { className: 'header-day-count' },
                `${day} / ३०`
              )
            ),

            /* WEB TABS CONTAINER (Bottom Border) */
            React.createElement('div', { className: 'web-tabs-container', ref: tabsContainerRef },
              TABS.map(tab => 
                React.createElement('button', {
                  key: tab.id,
                  className: `web-tab ${speaker === tab.id ? 'active' : ''}`,
                  onClick: (e) => handleSpeakerChange(tab.id, e)
                }, tab.label)
              )
            )
          ),

          /* SLIM PROGRESS TRACK */
          React.createElement('div', { className: 'progress-bar-wrap' },
            React.createElement('div', { className: 'progress-track' },
              React.createElement('div', {
                className: 'progress-fill',
                style: { width: `${progressPercent}%` }
              })
            )
          ),

          /* BOOK READING CONTAINER */
          React.createElement('main', {
            className: 'book-reader',
            onTouchStart: handleTouchStart,
            onTouchMove: handleTouchMove,
            onTouchEnd: handleTouchEnd
          },
            /* CHAPTER HEADER */
            React.createElement('div', { className: 'book-header' },
              React.createElement('h2', { className: 'chapter-title' }, title)
            ),

            /* SCROLLABLE BOOK BODY */
            React.createElement('div', { className: 'book-body', ref: scrollRef },
              React.createElement('div', { className: 'prose-content' },
                paragraphs.map((p, idx) => {
                  if(speaker === 'sanskar' && (p.includes('विचार:') || p.includes('कृती:'))) {
                     return React.createElement('p', { key: idx, className: 'book-paragraph sanskar-line' }, p);
                  }
                  return React.createElement('p', { key: idx, className: 'book-paragraph' }, p);
                })
              ),
              React.createElement('div', { className: 'closing-mantra-box' },
                React.createElement('p', { className: 'closing-text' },
                  React.createElement('i', { className: 'fa-solid fa-praying-hands' }),
                  ' आई-बाबांचे प्रेम आणि शुभ आशीर्वाद ',
                  React.createElement('i', { className: 'fa-solid fa-praying-hands' })
                )
              )
            )
          ),

          /* BOTTOM NAV */
          React.createElement('nav', { className: 'bottom-nav' },
            React.createElement('button', {
              className: 'nav-btn',
              onClick: goToPrev,
              disabled: safeIndex === 0
            },
              React.createElement('i', { className: 'fa-solid fa-chevron-left' }),
              ' मागील'
            ),

            React.createElement('button', {
              className: 'share-btn',
              onClick: handleShare
            },
              React.createElement('i', { className: 'fa-solid fa-share-nodes' }),
              'Share'
            ),

            React.createElement('button', {
              className: 'nav-btn',
              onClick: goToNext,
              disabled: safeIndex === totalDays - 1
            },
              'पुढील ',
              React.createElement('i', { className: 'fa-solid fa-chevron-right' })
            )
          ),

          /* DEDICATION FOOTER */
          React.createElement('div', { className: 'book-dedication-footer' },
            'प्रिय बाळासाठी, उर्मिला भरत रासवे तर्फे...'
          )
        ),

        /* TOAST */
        toastMsg ? React.createElement('div', { className: 'toast' }, toastMsg) : null
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
