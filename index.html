<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12">
  <meta name="description" content="उमाभरत गर्भसंवाद — प्रेम • संस्कार • प्रार्थना">
  <title>उमाभरत गर्भसंवाद</title>

  <!-- Google Marathi Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Noto+Serif+Devanagari:wght@400;600;700&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">

  <!-- React 18 & Lucide Icons -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* CSS Architecture & Variables */
    :root {
      --bg: #0d0b12;
      --surface: rgba(26, 22, 34, 0.96);
      --surface-soft: rgba(255, 255, 255, 0.04);
      --card-border: rgba(240, 185, 205, 0.12);
      --text: #fffbf7;
      --text-muted: #a69b9e;
      --content: #e8e0dc;
      --accent-rose: #f0a8c8;
      --accent-gold: #e2ba6f;
      --accent-violet: #ba8ce0;
      --primary: #a1547b;
      --line: rgba(255, 255, 255, 0.08);
      --shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
      --radius: 20px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: "Noto Sans Devanagari", sans-serif;
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(circle at 50% -15%, rgba(200, 110, 155, 0.15), transparent 45%), var(--bg);
    }

    .app {
      min-height: 100dvh; display: flex; justify-content: center;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    }

    .shell {
      width: min(760px, 100%);
      display: flex; flex-direction: column;
      padding: 12px; gap: 16px;
    }

    /* Header */
    .header { text-align: center; padding: 10px 0; }
    .header h1 { font-family: "Noto Serif Devanagari", serif; font-size: 1.4rem; color: var(--accent-rose); margin: 0; }
    .header p { font-size: 0.8rem; color: var(--text-muted); margin: 4px 0 0; }

    /* Home & Explore Modes */
    .home-section-title { font-size: 1.1rem; font-weight: 700; margin: 20px 0 10px; color: var(--accent-gold); }
    .card-grid { display: grid; gap: 12px; }
    
    .listing-card {
      background: var(--surface); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 16px; cursor: pointer;
      display: flex; flex-direction: column; gap: 8px;
    }
    .listing-card:hover { background: rgba(36, 30, 46, 0.96); }
    .meta-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }
    .card-title { font-size: 1.1rem; font-weight: 700; margin: 0; color: var(--text); }
    .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-pill { background: var(--surface-soft); padding: 2px 8px; border-radius: 99px; font-size: 0.7rem; color: var(--accent-rose); }

    /* Reader View */
    .reader-container {
      background: var(--surface); border: 1px solid var(--card-border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      height: calc(100dvh - 120px); overflow: hidden;
    }
    .reader-header {
      padding: 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
      background: rgba(26, 22, 34, 0.98); z-index: 10;
    }
    .reader-body {
      flex: 1; overflow-y: auto; padding: 20px 16px; font-size: 1.05rem; line-height: 1.8; color: var(--content);
    }
    .dialogue-para { margin-bottom: 16px; display: flex; gap: 12px; }
    .para-num { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-top: 4px; }
    .closing-blessing {
      text-align: center; margin-top: 30px; font-family: "Tiro Devanagari Marathi", serif;
      color: var(--accent-gold); font-size: 1.1rem; border-top: 1px solid var(--line); padding-top: 20px;
    }
    
    /* Filters */
    .filter-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--surface-soft); padding: 8px; border-radius: 12px; }
    .filter-btn { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; display: flex; gap: 6px; align-items: center; cursor: pointer;}
    .active-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(240, 168, 200, 0.15); color: var(--accent-rose); padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; }

    /* Bottom Nav */
    .bottom-nav { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); }
    .nav-btn { background: var(--surface-soft); color: var(--text); border: 1px solid var(--line); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo } = React;

    // 4. Data structure changes JSON (Example with 3 Person Types)
    const DIALOGUES_DB = [
      {
        id: "aai-01", person: "aai", personLabel: "आई", day: 1,
        title: "प्रेम आणि सुरक्षिततेची ऊब", category: "आरोग्य व शांतता",
        tags: ["प्रेम", "शांतता", "सुरक्षितता"],
        messages: [
          "माझ्या लाडक्या बाळा, आजपासून मी तुझ्याशी मनापासून एक सुंदर आणि अखंड संवाद सुरू करत आहे.",
          "तू माझ्या उदरात सुरक्षित आहेस आणि माझ्या हृदयाचा प्रत्येक ठोका फक्त तुझ्यासाठी प्रेमाने धडधडत आहे.",
          "माझ्या पोटावरून फिरणारा हा मायेचा हात तुला संपूर्ण जगातील सर्वात सुरक्षित जागा देत आहे."
        ],
        closing: "शांतपणे झोप आणि माझ्या प्रेमाची ऊब अनुभवत आनंदाने घडत राहा.",
        featured: true
      },
      {
        id: "baba-01", person: "baba", personLabel: "बाबा", day: 1,
        title: "पितृप्रेम, ओळख आणि सुरक्षिततेचे वचन", category: "कुटुंब व नाती",
        tags: ["प्रेम", "संरक्षण", "पितृप्रेम"],
        messages: [
          "माझ्या लाडक्या बाळा, मी तुझा बाबा तुझ्याशी बोलतोय; माझा हा आश्वासक आवाज तुझ्या अंतर्मनात शांततेने उतरू दे.",
          "तू या जगात येण्याआधीच माझे संपूर्ण आयुष्य तुझ्या प्रेमाने, आनंदाने आणि नव्या स्वप्नांनी भरून गेले आहे.",
          "तुला जगातल्या सर्व संकटांपासून दूर ठेवून सर्वोत्तम जीवन देण्याचा मी आज तुला अंतःकरणापासून शब्द देतो."
        ],
        closing: "तुझा बाबा तुझ्या आगमनाची अतिशय आतुरतेने वाट पाहत आहे."
      },
      {
        id: "aaibaba-01", person: "aaibaba", personLabel: "आई-बाबा", day: 1,
        title: "कुटुंबातील आनंदाचे वातावरण आणि स्वागताची आतुरता", category: "कुटुंब व नाती",
        tags: ["कुटुंब", "आनंद", "सकारात्मकता"],
        messages: [
          "माझ्या लाडक्या बाळा, आज आम्ही दोघेही एकत्र बसून तुझ्याशी मनापासून गप्पा मारायला आलो आहोत.",
          "तू आमच्या आयुष्यात येणार आहेस या एकाच विचाराने आमचे संपूर्ण घर आनंदाने आणि उत्साहाने भरून गेले आहे.",
          "अगदी निर्धास्त आणि आनंदी राहा; आम्ही दोघेही तुझी अतिशय आतुरतेने वाट पाहत आहोत!"
        ],
        closing: "आमचे दोघांचे तुझ्यावर अनंत जन्मांचे प्रेम आहे!"
      }
    ];

    function App() {
      const [view, setView] = useState('home'); // home, explore, reader
      const [filters, setFilters] = useState({ person: 'सर्व', category: 'सर्व', tags: [] });
      const [currentDialogue, setCurrentDialogue] = useState(null);
      const [progress, setProgress] = useState({ currentDay: 1 });

      // LocalStorage Persistence (Requirement 18)
      useEffect(() => {
  Promise.all([
    fetch('./data/mothers.json').then(res => res.json()),
    fetch('./data/fathers.json').then(res => res.json()),
    fetch('./data/both.json').then(res => res.json())
  ]).then(([mothers, fathers, both]) => {
    const combinedData = [...mothers, ...fathers, ...both];
    setDialoguesDB(combinedData); // Store all data in a single state variable
  }).catch(err => console.error("Error loading dialogue data", err));
}, []);

      const saveProgress = (day) => {
        const p = { currentDay: day };
        setProgress(p);
        localStorage.setItem('garbhasamwad_progress', JSON.stringify(p));
      };

      const filteredDialogues = useMemo(() => {
        return DIALOGUES_DB.filter(d => {
          const matchPerson = filters.person === 'सर्व' || d.personLabel === filters.person;
          const matchCat = filters.category === 'सर्व' || d.category === filters.category;
          return matchPerson && matchCat;
        });
      }, [filters]);

      const openReader = (dialogue) => {
        setCurrentDialogue(dialogue);
        saveProgress(dialogue.day);
        setView('reader');
      };

      const navigateDialogue = (direction) => {
        const currentIndex = filteredDialogues.findIndex(d => d.id === currentDialogue.id);
        const nextIndex = currentIndex + direction;
        if (nextIndex >= 0 && nextIndex < filteredDialogues.length) {
          openReader(filteredDialogues[nextIndex]);
        }
      };

      return React.createElement('div', { className: 'app' },
        React.createElement('div', { className: 'shell' },
          
          React.createElement('header', { className: 'header' },
            React.createElement('h1', null, '🌸 गर्भसंवाद'),
            React.createElement('p', null, 'प्रेम • संस्कार • प्रार्थना')
          ),

          view === 'home' && React.createElement(React.Fragment, null,
            React.createElement('div', { className: 'filter-bar' },
               React.createElement('button', { className: 'filter-btn', onClick: () => setView('explore') }, '☷ संवाद शोधा / फिल्टर'),
               React.createElement('div', null, 'दिवस ' + progress.currentDay + ' / ३०')
            ),
            React.createElement('h2', { className: 'home-section-title' }, 'आजचा संवाद'),
            React.createElement('div', { className: 'card-grid' },
              DIALOGUES_DB.slice(0,3).map(d => 
                React.createElement('div', { key: d.id, className: 'listing-card', onClick: () => openReader(d) },
                  React.createElement('div', { className: 'meta-row' },
                    React.createElement('span', null, d.personLabel),
                    React.createElement('span', null, 'दिवस ' + d.day)
                  ),
                  React.createElement('h3', { className: 'card-title' }, d.title),
                  React.createElement('div', { className: 'tag-row' },
                    d.tags.map(t => React.createElement('span', { key: t, className: 'tag-pill' }, '#' + t))
                  )
                )
              )
            )
          ),

          view === 'explore' && React.createElement(React.Fragment, null,
            React.createElement('div', { className: 'active-chips' },
              React.createElement('span', { className: 'chip', onClick: () => setView('home') }, '← मागे'),
              filters.person !== 'सर्व' && React.createElement('span', { className: 'chip', onClick: () => setFilters({...filters, person: 'सर्व'}) }, filters.person + ' ×'),
              filters.category !== 'सर्व' && React.createElement('span', { className: 'chip', onClick: () => setFilters({...filters, category: 'सर्व'}) }, filters.category + ' ×')
            ),
            React.createElement('div', { className: 'filter-bar', style: {marginBottom: '16px'} },
               ['सर्व', 'आई', 'बाबा', 'आई-बाबा'].map(p => 
                 React.createElement('button', { 
                   key: p, 
                   className: 'filter-btn', 
                   style: filters.person === p ? {borderColor: 'var(--accent-rose)', color: 'var(--accent-rose)'} : {},
                   onClick: () => setFilters({...filters, person: p}) 
                 }, p)
               )
            ),
            React.createElement('div', { style: {fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '8px'} }, filteredDialogues.length + ' संवाद'),
            React.createElement('div', { className: 'card-grid' },
              filteredDialogues.map(d => 
                React.createElement('div', { key: d.id, className: 'listing-card', onClick: () => openReader(d) },
                  React.createElement('div', { className: 'meta-row' },
                    React.createElement('span', null, d.personLabel),
                    React.createElement('span', null, 'दिवस ' + d.day)
                  ),
                  React.createElement('h3', { className: 'card-title' }, d.title)
                )
              )
            )
          ),

          view === 'reader' && currentDialogue && React.createElement('div', { className: 'reader-container' },
            React.createElement('div', { className: 'reader-header' },
               React.createElement('div', { className: 'meta-row', style: {marginBottom: '8px'} },
                  React.createElement('span', { style: {color: 'var(--accent-rose)'} }, currentDialogue.personLabel + ' • दिवस ' + currentDialogue.day),
                  React.createElement('span', null, currentDialogue.category)
               ),
               React.createElement('h2', { className: 'card-title', style: {fontSize: '1.25rem'} }, currentDialogue.title)
            ),
            React.createElement('div', { className: 'reader-body' },
               currentDialogue.messages.map((msg, idx) => 
                 React.createElement('div', { key: idx, className: 'dialogue-para' },
                   React.createElement('span', { className: 'para-num' }, String(idx + 1).padStart(2, '0')),
                   React.createElement('div', null, msg)
                 )
               ),
               React.createElement('div', { className: 'closing-blessing' }, '✦ ' + currentDialogue.closing + ' ✦')
            ),
            React.createElement('nav', { className: 'bottom-nav' },
               React.createElement('button', { className: 'nav-btn', onClick: () => {
                 const idx = filteredDialogues.findIndex(d => d.id === currentDialogue.id);
                 if (idx > 0) navigateDialogue(-1); else setView('home');
               }}, '← मागे'),
               React.createElement('button', { className: 'nav-btn', disabled: filteredDialogues.findIndex(d => d.id === currentDialogue.id) === filteredDialogues.length - 1, onClick: () => navigateDialogue(1) }, 'पुढे →')
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
