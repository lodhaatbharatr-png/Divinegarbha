<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12">
  <meta name="description" content="उमाभरत गर्भसंवाद — प्रेम • संस्कार • प्रार्थना">
  <title>उमाभरत गर्भसंवाद</title>

  <!-- Existing React 18 + Lucide CDN architecture preserved -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@500;600;700&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root{
      --bg:#0d0b12;--surface:#1a1622;--surface-soft:#211b2a;--surface-hover:#282031;
      --text:#fffbf7;--content:#eee5e1;--muted:#aaa0a4;--dim:#81767d;
      --rose:#f0a8c8;--rose-strong:#a1547b;--gold:#e2ba6f;--violet:#c7a8df;
      --line:rgba(255,255,255,.09);--line-strong:rgba(240,168,200,.2);
      --shadow:0 24px 70px rgba(0,0,0,.48);--radius:22px;--reader:740px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;background:
      radial-gradient(circle at 50% -15%,rgba(200,110,155,.17),transparent 42%),
      radial-gradient(circle at 90% 85%,rgba(130,80,120,.12),transparent 38%),var(--bg);
      color:var(--text);font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif;overflow-x:hidden}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed}
    :focus-visible{outline:2px solid var(--rose);outline-offset:2px}
    .app{min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
    .shell{width:min(1180px,100%);margin:auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 2px 16px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#d482a5,#713652);border:1px solid rgba(255,230,240,.22);box-shadow:0 6px 22px rgba(212,130,165,.2);font-weight:800}
    .brand h1{margin:0;font-size:1rem;font-weight:800;line-height:1.15}
    .brand p{margin:3px 0 0;color:var(--muted);font-size:.7rem}
    .person-switch{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:999px}
    .person-btn{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:7px 13px;font-size:.76rem;font-weight:700;white-space:nowrap}
    .person-btn.active{background:var(--surface-soft);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
    .hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:8px 0 18px}
    .hero-copy .eyebrow{color:var(--rose);font-size:.75rem;font-weight:800}
    .hero-copy h2{font-family:"Noto Serif Devanagari",serif;margin:4px 0 4px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.2}
    .hero-copy p{margin:0;color:var(--muted);font-size:.88rem}
    .hero-actions{display:flex;gap:8px}
    .icon-btn,.filter-trigger{min-height:42px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);border-radius:13px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:.78rem;font-weight:700}
    .icon-btn:hover,.filter-trigger:hover{background:rgba(255,255,255,.08)}
    .searchbar{position:relative;margin-bottom:12px}
    .searchbar input{width:100%;height:50px;border:1px solid var(--line);background:rgba(26,22,34,.82);color:var(--text);border-radius:15px;padding:0 46px 0 46px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.15)}
    .searchbar input::placeholder{color:#8e8589}
    .searchbar .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .searchbar .clear-search{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:7px}
    .mobile-filter{display:none;margin-bottom:12px}
    .layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:16px;align-items:start}
    .sidebar{position:sticky;top:14px;border:1px solid var(--line);background:rgba(26,22,34,.78);border-radius:18px;padding:15px}
    .filter-section+.filter-section{margin-top:20px}
    .filter-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:.76rem;font-weight:800;color:#fff}
    .filter-title small{color:var(--dim);font-weight:600}
    .filter-list{display:grid;gap:5px}
    .filter-option{width:100%;border:0;background:transparent;color:var(--muted);padding:8px 9px;border-radius:9px;text-align:left;font-size:.76rem;display:flex;justify-content:space-between;gap:8px}
    .filter-option:hover{background:rgba(255,255,255,.04);color:var(--text)}
    .filter-option.active{background:rgba(240,168,200,.09);color:var(--rose);font-weight:800}
    .count{color:var(--dim);font-size:.68rem}
    .filter-option.active .count{color:var(--rose)}
    .tag-cloud{display:flex;flex-wrap:wrap;gap:6px}
    .tag{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#c8bec2;border-radius:999px;padding:5px 8px;font-size:.67rem}
    .tag:hover,.tag.active{border-color:var(--line-strong);color:var(--rose);background:rgba(240,168,200,.08)}
    .clear-all{width:100%;margin-top:16px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px;font-size:.72rem;font-weight:700}
    .main{min-width:0}
    .context-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:30px}
    .context-left{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
    .result-count{font-size:.76rem;color:var(--muted)}
    .active-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);background:rgba(240,168,200,.07);color:var(--rose);border-radius:999px;padding:4px 8px;font-size:.67rem;font-weight:700}
    .active-chip button{border:0;background:transparent;color:inherit;padding:0;line-height:1}
    .list{display:grid;gap:10px}
    .result-card{width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,rgba(31,26,40,.95),rgba(23,19,30,.95));color:var(--text);border-radius:17px;padding:15px;transition:transform .16s ease,border-color .16s ease,background .16s ease}
    .result-card:hover{transform:translateY(-1px);border-color:var(--line-strong);background:var(--surface-hover)}
    .card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
    .person-label,.category-label{font-size:.68rem;font-weight:800}
    .person-label{color:var(--rose)}
    .category-label{color:var(--gold)}
    .result-card h3{margin:0 0 6px;font-family:"Noto Serif Devanagari",serif;font-size:1rem;line-height:1.35}
    .preview{margin:0;color:var(--muted);font-size:.77rem;line-height:1.65}
    .result-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
    .result-tags span{color:#a99da3;font-size:.63rem}
    .read-link{display:inline-flex;align-items:center;gap:4px;color:var(--rose);font-size:.7rem;font-weight:800;margin-top:10px}
    .empty{border:1px dashed var(--line-strong);border-radius:17px;padding:34px 20px;text-align:center}
    .empty h3{margin:0 0 6px;font-family:"Noto Serif Devanagari",serif}
    .empty p{margin:0;color:var(--muted);font-size:.78rem}
    .empty .tag-cloud{justify-content:center;margin-top:15px}
    .reader{border:1px solid var(--line);background:rgba(26,22,34,.93);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .reader-head{padding:17px 20px 14px;border-bottom:1px solid var(--line);background:rgba(26,22,34,.97)}
    .reader-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
    .reader-person{color:var(--rose);font-size:.72rem;font-weight:800}
    .reader-day{color:var(--gold);font-size:.73rem;font-weight:800}
    .crumb{color:var(--dim);font-size:.65rem;margin-bottom:5px}
    .reader h2{margin:0;font-family:"Noto Serif Devanagari",serif;font-size:clamp(1.25rem,3vw,1.65rem);line-height:1.35}
    .reader-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
    .reader-body{max-width:var(--reader);margin:auto;padding:18px 22px 28px}
    .dialogue{display:grid;gap:18px}
    .dialogue-item{display:grid;grid-template-columns:29px 1fr;gap:12px;align-items:start}
    .dialogue-num{color:#81747b;font-size:.66rem;font-weight:800;padding-top:5px;text-align:center}
    .dialogue-text{margin:0;color:var(--content);font-size:clamp(.98rem,1.5vw,1.08rem);line-height:2;font-weight:500;white-space:pre-wrap}
    .closing{margin-top:24px;padding:19px 14px;border-top:1px solid var(--line);text-align:center;color:var(--rose);font-family:"Tiro Devanagari Marathi","Noto Serif Devanagari",serif;font-size:.95rem;line-height:1.7}
    .reader-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:12px 16px;background:rgba(18,15,23,.78)}
    .nav-btn{min-height:46px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);color:var(--text);padding:0 15px;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800}
    .nav-btn.primary{background:linear-gradient(135deg,#a75c82,#7e3b5e);border-color:rgba(255,255,255,.13)}
    .nav-btn:disabled{opacity:.28}
    .reader-center{color:var(--muted);font-size:.7rem;font-weight:700}
    .reader-actions{display:flex;gap:7px}
    .share-btn,.complete-btn{min-height:42px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:var(--text);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800}
    .complete-btn.done{color:#d9c58f;border-color:rgba(226,186,111,.3);background:rgba(226,186,111,.07)}
    .journey{margin-top:16px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.025);padding:13px 15px}
    .journey-top{display:flex;justify-content:space-between;gap:10px;font-size:.73rem;font-weight:800}
    .journey-top span:last-child{color:var(--rose)}
    .journey-bar{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:9px}
    .journey-fill{height:100%;background:linear-gradient(90deg,var(--rose-strong),var(--rose));border-radius:inherit}
    .journey-copy{margin:7px 0 0;color:var(--muted);font-size:.68rem}
    .day-picker{position:fixed;inset:0;background:rgba(4,3,6,.72);backdrop-filter:blur(7px);z-index:80;display:grid;place-items:center;padding:18px}
    .day-dialog{width:min(390px,100%);background:#1a1622;border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow);padding:17px}
    .day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
    .day-head h3{margin:0;font-family:"Noto Serif Devanagari",serif;font-size:1rem}
    .day-head button{border:0;background:transparent;color:var(--muted);padding:6px}
    .day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .day-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:var(--muted);font-weight:800;font-size:.75rem}
    .day-cell.active{background:rgba(240,168,200,.13);border-color:var(--rose);color:var(--rose)}
    .day-cell.completed{position:relative}
    .day-cell.completed:after{content:"✓";position:absolute;right:4px;top:1px;color:var(--gold);font-size:.55rem}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(4,3,6,.68);z-index:90}
    .filter-sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:#19151f;border:1px solid var(--line-strong);border-radius:22px 22px 0 0;padding:17px 16px max(17px,env(safe-area-inset-bottom));max-height:86dvh;overflow:auto}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
    .sheet-head h3{margin:0;font-family:"Noto Serif Devanagari",serif}
    .sheet-grid{display:grid;gap:17px}
    .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}
    .sheet-actions button{min-height:44px;border-radius:12px;font-weight:800}
    .apply{border:0;background:linear-gradient(135deg,#a75c82,#7e3b5e);color:#fff}
    .sheet-clear{border:1px solid var(--line);background:transparent;color:var(--muted)}
    .toast{position:fixed;left:50%;bottom:max(78px,calc(70px + env(safe-area-inset-bottom)));transform:translateX(-50%);z-index:120;background:#211c29;border:1px solid var(--line-strong);color:#fff;padding:9px 15px;border-radius:999px;font-size:.72rem;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5)}
    .loading{min-height:60dvh;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
    mark{background:rgba(226,186,111,.22);color:#ffe7ae;border-radius:3px;padding:0 2px}
    @media(max-width:820px){
      .layout{display:block}.sidebar{display:none}.mobile-filter{display:block}.hero{grid-template-columns:1fr}.hero-actions{justify-content:flex-start}
      .reader{border-radius:18px}.reader-body{padding:17px 16px 30px}
    }
    @media(max-width:600px){
      .app{padding-left:10px;padding-right:10px}.topbar{align-items:flex-start;gap:10px}.logo{width:38px;height:38px}
      .brand h1{font-size:.9rem}.brand p{font-size:.63rem}.person-switch{width:100%;justify-content:stretch}.person-btn{flex:1;padding:7px 5px;font-size:.69rem}
      .topbar{flex-wrap:wrap}.topbar .brand{flex:1 1 100%}.topbar .person-switch{flex:1 1 100%}
      .hero{margin-top:3px}.hero-copy h2{font-size:1.4rem}.hero-actions{display:none}
      .searchbar input{height:48px}.context-row{align-items:flex-start}.reader-head{padding:15px 15px 13px}
      .reader-foot{position:sticky;bottom:0;z-index:20;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(18,15,23,.96);backdrop-filter:blur(12px)}
      .reader-center{display:none}.nav-btn{min-height:45px;padding:0 12px}.reader-actions{display:none}
      .dialogue-item{grid-template-columns:25px 1fr;gap:9px}.dialogue-text{font-size:.96rem;line-height:1.9}
      .journey{margin-top:12px}
    }
    @media(max-width:380px){
      .person-btn{font-size:.65rem}.reader-body{padding-left:12px;padding-right:12px}.dialogue-item{grid-template-columns:22px 1fr;gap:7px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
    }
  </style>
</head>

<script>
const {useState,useEffect,useMemo,useRef}=React;

/* ------------------------------------------------------------------

   ./data/mother.json, ./data/fathers.json, ./data/father.json.

const FALLBACK_MOTHER=[
 ["दिवस १","प्रेम आणि सुरक्षिततेची ऊब","१. माझ्या लाडक्या बाळा, आजपासून मी तुझ्याशी मनापासून एक सुंदर आणि अखंड संवाद सुरू करत आहे.\n२. तू माझ्या उदरात सुरक्षित आहेस आणि माझ्या हृदयाचा प्रत्येक ठोका फक्त तुझ्यासाठी प्रेमाने धडधडत आहे.\n३. माझ्या पोटावरून फिरणारा हा मायेचा हात तुला संपूर्ण जगातील सर्वात सुरक्षित जागा देत आहे.\n४. तू या जगात येण्याआधीच मी आणि तुझे बाबा तुझ्यावर अथांग आणि निरपेक्ष प्रेम करत आहोत.\n५. माझ्या श्वासासोबत वाहणारी प्रत्येक भावना तुझ्या मनाला असीम शांती आणि तृप्ती देणारी ठरो.\n६. तुझ्या आजूबाजूला केवळ सकारात्मक, शुद्ध आणि प्रेमळ स्पंदनांचे एक अभेद्य कवच निर्माण झाले आहे.\n७. स्वतःवर प्रेम करण्याचे आणि जगाला भरभरून प्रेम देण्याचे उत्तम संस्कार तुझ्या अंतर्मनात रुजत आहेत.\n८. कोणत्याही भीतीशिवाय आणि संकोचाशिवाय तू माझ्या कुशीत अगदी निर्धास्तपणे आणि सुखाने वाढत राहा.\n९. तुझे अस्तित्व हे आमच्या संपूर्ण घराचे चैतन्य, आनंद आणि प्रकाशाचा अखंड झरा आहे.\n१०. बाळा, शांतपणे झोप आणि माझ्या प्रेमाची ऊब अनुभवत अतिशय आनंदाने आणि उत्साहाने घडत राहा."],

const TAXONOMY=[
 ["आरोग्य व शांतता",["आरोग्य","शांतता","सुरक्षितता","सकारात्मकता","तेज"]],

 ["धैर्य व आत्मविश्वास",["धैर्य","निर्भयता","शौर्य","आत्मविश्वास","न्याय","नेतृत्व"]],

 ["अध्यात्म व भक्ती",["अध्यात्म","भक्ती","कर्मयोग","श्रद्धा","समतोल"]],
 ["जीवनदृष्टी",["जीवनदृष्टी","समतोल","आनंद","नीती","मूल्ये"]],
 ["निसर्ग व पर्यावरण",["निसर्ग","पर्यावरण","पंचमहाभूते","जीवन"]],
 ["ध्येय व व्यक्तिमत्त्व",["ध्येय","व्यक्तिमत्त्व","यश","आत्मविश्वास","नेतृत्व"]],
 ["नीती व चारित्र्य",["नीती","चारित्र्य","न्याय","प्रामाणिकपणा"]],
 ["शिक्षण व जिज्ञासा",["शिक्षण","जिज्ञासा","ज्ञान","विज्ञान","तर्क"]]
];

function normalize(s){
  return String(s??"").normalize("NFC").replace(/\s+/g," ").trim().toLocaleLowerCase("mr-IN");
}
function inferMeta(title,content,person,index){
  const hay=normalize(title+" "+content);
  let best=TAXONOMY[0],score=-1;
  TAXONOMY.forEach(([cat,tags])=>{
    const sc=tags.reduce((n,t)=>n+(hay.includes(normalize(t))?1:0),0);
    if(sc>score){score=sc;best=[cat,tags]}
  });
  const tags=best[1].filter(t=>hay.includes(normalize(t)));
  if(!tags.length) tags.push(...best[1].slice(0,3));
  return {category:best[0],tags:[...new Set(tags)],featured:index===0};
}
function normalizeRecord(raw,person,index){
  if(raw&&typeof raw==="object"&&!Array.isArray(raw)){
    const messages=Array.isArray(raw.messages)?raw.messages:(typeof raw.content==="string"?raw.content.split("\n").filter(Boolean):[]);
    const title=raw.title||raw.name||"संवाद";
    const meta=inferMeta(title,messages.join(" "),person,index);
    return {id:raw.id||`${person}-${String(index+1).padStart(2,"0")}`,person,personLabel:person==="aai"?"आई":person==="baba"?"बाबा":"आई-बाबा",title,category:raw.category||meta.category,tags:Array.isArray(raw.tags)&&raw.tags.length?raw.tags:meta.tags,day:Number(raw.day)||index+1,messages,closing:raw.closing||"✨ आई-बाबांचे प्रेम आणि शुभ आशीर्वाद ✨",featured:!!raw.featured};
  }
  const [day,title,content]=raw||[];
  const messages=Array.isArray(content)?content:String(content||"").split("\n").filter(x=>x.trim());
  const meta=inferMeta(title,messages.join(" "),person,index);
  return {id:`${person}-${String(index+1).padStart(2,"0")}`,person,personLabel:person==="aai"?"आई":"बाबा",title,category:meta.category,tags:meta.tags,day:index+1,messages,closing:"✨ आई-बाबांचे प्रेम आणि शुभ आशीर्वाद ✨",featured:index===0};
}
function mergeJoint(mothers,fathers){
  const max=Math.max(mothers.length,fathers.length);
  const out=[];
  for(let i=0;i<max;i++){
    const a=mothers[i],b=fathers[i];
    if(!a&&!b)continue;
    const day=a?.day||b?.day||i+1;
    const title=a&&b?`${a.title} • ${b.title}`:(a?.title||b?.title||"आई-बाबांचा संवाद");
    const messages=[...(a?.messages||[]),...(b?.messages||[])];
    const meta=inferMeta(title,messages.join(" "),"joint",i);
    out.push({id:`aai-baba-${String(day).padStart(2,"0")}`,person:"joint",personLabel:"आई-बाबा",title,category:meta.category,tags:[...new Set([...(a?.tags||[]),...(b?.tags||[]),...meta.tags])],day,messages,closing:"✨ आई-बाबांचे प्रेम आणि शुभ आशीर्वाद ✨",featured:i===0});
  }
  return out;
}

function App(){
  const [rawMother,setRawMother]=useState(FALLBACK_MOTHER);
  const [rawFather,setRawFather]=useState(FALLBACK_FATHER);
  const [loading,setLoading]=useState(true);
  const [person,setPerson]=useState(()=>localStorage.getItem("gs-person")||"all");
  const [category,setCategory]=useState(()=>localStorage.getItem("gs-category")||"all");
  const [tags,setTags]=useState(()=>JSON.parse(localStorage.getItem("gs-tags")||"[]"));
  const [query,setQuery]=useState("");
  const [selectedId,setSelectedId]=useState(()=>localStorage.getItem("gs-selected")||"");
  const [completed,setCompleted]=useState(()=>JSON.parse(localStorage.getItem("gs-completed")||"[]"));
  const [progressDay,setProgressDay]=useState(()=>Number(localStorage.getItem("gs-day")||1));
  const [showFilters,setShowFilters]=useState(false);
  const [showDays,setShowDays]=useState(false);
  const [toast,setToast]=useState("");
  const readerRef=useRef(null);

  useEffect(()=>{
    let alive=true;
    const load=(primary,fallback,setter)=>fetch(primary).then(r=>r.ok?r.json():fetch(fallback).then(x=>x.json())).then(d=>{
      if(alive&&Array.isArray(d)&&d.length)setter(d);
    }).catch(()=>{}).finally(()=>{if(alive)setLoading(false)});
    Promise.allSettled([load("./data/mothers.json","./data/mother.json",setRawMother),load("./data/fathers.json","./data/father.json",setRawFather)])
      .finally(()=>alive&&setLoading(false));
    return()=>{alive=false};
  },[]);

  const mother=useMemo(()=>rawMother.map((x,i)=>normalizeRecord(x,"aai",i)),[rawMother]);
  const father=useMemo(()=>rawFather.map((x,i)=>normalizeRecord(x,"baba",i)),[rawFather]);
  const joint=useMemo(()=>mergeJoint(mother,father),[mother,father]);
  const allData=useMemo(()=>[...mother,...father,...joint],[mother,father,joint]);

  const scoped=useMemo(()=>{
    if(person==="aai")return mother;
    if(person==="baba")return father;
    if(person==="joint")return joint;
    return allData;
  },[person,mother,father,joint,allData]);

  const categories=useMemo(()=>{
    const map=new Map();
    scoped.forEach(d=>map.set(d.category,(map.get(d.category)||0)+1));
    return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],"mr"));
  },[scoped]);
  const tagCounts=useMemo(()=>{
    const map=new Map();
    scoped.forEach(d=>d.tags.forEach(t=>map.set(t,(map.get(t)||0)+1)));
    return [...map.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"mr"));
  },[scoped]);

  const results=useMemo(()=>{
    const q=normalize(query);
    return scoped.filter(d=>{
      const catOk=category==="all"||d.category===category;
      const tagsOk=tags.every(t=>d.tags.includes(t));
      const hay=normalize([d.title,d.category,d.tags.join(" "),d.personLabel,d.day,d.messages.join(" ")].join(" "));
      return catOk&&tagsOk&&(!q||hay.includes(q));
    });
  },[scoped,category,tags,query]);

  const selected=useMemo(()=>{
    if(selectedId){
      const exact=allData.find(d=>d.id===selectedId);
      if(exact)return exact;
    }
    return results[0]||scoped.find(d=>d.day===progressDay)||scoped[0]||null;
  },[selectedId,allData,results,scoped,progressDay]);

  useEffect(()=>{
    localStorage.setItem("gs-person",person);
    localStorage.setItem("gs-category",category);
    localStorage.setItem("gs-tags",JSON.stringify(tags));
    if(selected)localStorage.setItem("gs-selected",selected.id);
  },[person,category,tags,selected]);

  useEffect(()=>{
    if(selected){
      localStorage.setItem("gs-day",String(selected.day));
      setProgressDay(selected.day);
      const el=readerRef.current;
      if(el && !selectedId) el.scrollTop=0;
      if(selectedId) setTimeout(()=>{if(readerRef.current)readerRef.current.scrollTop=0},0);
    }
  },[selected?.id]);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2300)};
  const clearAll=()=>{setPerson("all");setCategory("all");setTags([]);setQuery("");setSelectedId("")};
  const toggleTag=t=>setTags(v=>v.includes(t)?v.filter(x=>x!==t):[...v,t]);
  const openDialogue=d=>{setSelectedId(d.id);setShowFilters(false);window.scrollTo({top:0,behavior:"smooth"})};
